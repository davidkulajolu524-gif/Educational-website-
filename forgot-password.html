<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | EduVerse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="auth-page">
    <header><nav class="navbar">
        <a class="logo" href="index.html"><i class="fa-solid fa-graduation-cap"></i><span>EduVerse</span></a>
        <div class="nav-right"><a class="back-link" href="auth.html">Back to login</a><button id="theme-btn" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button></div>
    </nav></header>
    <main class="auth-layout">
        <section class="auth-intro"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Find your way <span>back in.</span></h1><p>Request a reset code, choose a new password, and return to your learning path.</p></section>
        <section class="auth-card" aria-label="Reset password">
            <p class="eyebrow">RESET PASSWORD</p>
            <h2>Recover your account</h2>
            <form id="forgotPasswordForm" class="reset-form">
                <p>Enter your account email to create a reset code.</p>
                <label for="resetEmail">Email</label><input id="resetEmail" name="email" type="email" autocomplete="email" required>
                <button class="auth-submit" type="submit">Create reset code</button>
            </form>
            <form id="resetPasswordForm" class="reset-form" hidden>
                <label for="resetToken">Reset code</label><input id="resetToken" name="token" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
                <label for="newPassword">New password</label><input id="newPassword" name="password" type="password" minlength="8" autocomplete="new-password" required>
                <button class="auth-submit" type="submit">Reset password</button>
            </form>
            <p id="resetMessage" class="auth-message" role="status"></p>
            <a class="text-link auth-forgot" href="auth.html">Back to login or sign up</a>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
